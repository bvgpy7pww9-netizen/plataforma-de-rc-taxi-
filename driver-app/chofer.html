<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>RC Taxi — App del Chofer</title>
<style>
  :root { --green:#1db954; --red:#e63946; --dark:#111; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Helvetica, Arial, sans-serif;
    background: #0f0f12; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #999; font-size: 14px; margin-bottom: 24px; }
  .card {
    background: #1b1b20; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 380px;
  }
  input {
    width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid #333; background: #0f0f12; color: #fff; font-size: 16px;
  }
  button {
    width: 100%; padding: 16px; border-radius: 10px; border: none;
    font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .btn-primary { background: var(--green); color: #000; }
  .btn-secondary { background: transparent; color: #ccc; border: 1px solid #444; }
  .toggle { display:flex; gap:8px; margin-bottom:18px; }
  .toggle button { flex:1; background:#0f0f12; color:#999; border:1px solid #333; }
  .toggle button.active { background:#fff; color:#000; }
  .status-screen { text-align:center; }
  .dot { width:18px; height:18px; border-radius:50%; display:inline-block; margin-right:8px; vertical-align:middle; }
  .dot.online { background: var(--green); box-shadow:0 0 12px var(--green); }
  .dot.offline { background:#555; }
  .big-btn { padding:28px; font-size:20px; border-radius:16px; }
  .big-btn.online { background: var(--red); color:#fff; }
  .big-btn.offline { background: var(--green); color:#000; }
  .msg { color: var(--red); font-size:14px; margin-top:8px; min-height:18px; }
  .info { color:#999; font-size:13px; margin-top:16px; line-height:1.5; }
  .driver-name { font-size:20px; font-weight:600; margin-bottom:2px; }
  .car { color:#999; font-size:14px; margin-bottom:24px; }
</style>
</head>
<body>

<h1>RC Taxi y Limo</h1>
<div class="sub">App del chofer</div>

<div class="card" id="authCard">
  <div class="toggle">
    <button id="tabLogin" class="active" onclick="showTab('login')">Iniciar sesión</button>
    <button id="tabRegister" onclick="showTab('register')">Registrarme</button>
  </div>

  <div id="loginForm">
    <input id="loginPhone" placeholder="Teléfono" inputmode="tel" />
    <input id="loginPassword" placeholder="Contraseña" type="password" />
    <button class="btn-primary" onclick="login()">Entrar</button>
  </div>

  <div id="registerForm" style="display:none">
    <input id="regName" placeholder="Nombre completo" />
    <input id="regPhone" placeholder="Teléfono" inputmode="tel" />
    <input id="regCar" placeholder="Número de carro (ej. RC-101)" />
    <input id="regPassword" placeholder="Contraseña" type="password" />
    <button class="btn-primary" onclick="register()">Crear cuenta</button>
  </div>

  <div class="msg" id="authMsg"></div>
</div>

<div class="card status-screen" id="statusCard" style="display:none">
  <div class="driver-name" id="statusName"></div>
  <div class="car" id="statusCar"></div>

  <div style="margin-bottom:20px;">
    <span class="dot offline" id="statusDot"></span>
    <span id="statusText">Desconectado</span>
  </div>

  <button class="big-btn offline" id="toggleBtn" onclick="toggleOnline()">Conectarme</button>
  <div class="msg" id="statusMsg"></div>
  <div class="info">Cuando estás conectado, tu ubicación se manda automáticamente cada 10 segundos para que la base te vea en el mapa.</div>

  <button class="btn-secondary" style="margin-top:20px;" onclick="logout()">Cerrar sesión</button>
</div>

<script>
  const API = ""; // mismo origen (Render sirve todo desde un solo servicio)
  let token = localStorage.getItem("rc_token");
  let driver = JSON.parse(localStorage.getItem("rc_driver") || "null");
  let online = false;
  let watchTimer = null;

  function showTab(tab) {
    document.getElementById("tabLogin").classList.toggle("active", tab === "login");
    document.getElementById("tabRegister").classList.toggle("active", tab === "register");
    document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
    document.getElementById("registerForm").style.display = tab === "register" ? "block" : "none";
    document.getElementById("authMsg").textContent = "";
  }

  async function register() {
    const name = document.getElementById("regName").value.trim();
    const phone = document.getElementById("regPhone").value.trim();
    const carNumber = document.getElementById("regCar").value.trim();
    const password = document.getElementById("regPassword").value;
    const msg = document.getElementById("authMsg");
    if (!name || !phone || !carNumber || !password) { msg.textContent = "Completá todos los campos."; return; }
    msg.textContent = "Creando cuenta...";
    try {
      const r = await fetch(API + "/api/register", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, phone, carNumber, password })
      });
      const data = await r.json();
      if (!r.ok) { msg.textContent = data.error || "Error al registrar."; return; }
      saveSession(data.token, data.driver);
    } catch (e) { msg.textContent = "No se pudo conectar al servidor."; }
  }

  async function login() {
    const phone = document.getElementById("loginPhone").value.trim();
    const password = document.getElementById("loginPassword").value;
    const msg = document.getElementById("authMsg");
    if (!phone || !password) { msg.textContent = "Completá teléfono y contraseña."; return; }
    msg.textContent = "Entrando...";
    try {
      const r = await fetch(API + "/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, password })
      });
      const data = await r.json();
      if (!r.ok) { msg.textContent = data.error || "Error al iniciar sesión."; return; }
      saveSession(data.token, data.driver);
    } catch (e) { msg.textContent = "No se pudo conectar al servidor."; }
  }

  function saveSession(t, d) {
    token = t; driver = d;
    localStorage.setItem("rc_token", t);
    localStorage.setItem("rc_driver", JSON.stringify(d));
    showStatusScreen();
  }

  function logout() {
    stopSendingLocation();
    localStorage.removeItem("rc_token");
    localStorage.removeItem("rc_driver");
    token = null; driver = null;
    document.getElementById("authCard").style.display = "block";
    document.getElementById("statusCard").style.display = "none";
  }

  function showStatusScreen() {
    document.getElementById("authCard").style.display = "none";
    document.getElementById("statusCard").style.display = "block";
    document.getElementById("statusName").textContent = driver.name;
    document.getElementById("statusCar").textContent = driver.carNumber;
  }

  function setOnlineUI(isOnline) {
    online = isOnline;
    document.getElementById("statusDot").className = "dot " + (isOnline ? "online" : "offline");
    document.getElementById("statusText").textContent = isOnline ? "En línea" : "Desconectado";
    const btn = document.getElementById("toggleBtn");
    btn.textContent = isOnline ? "Desconectarme" : "Conectarme";
    btn.className = "big-btn " + (isOnline ? "online" : "offline");
  }

  async function toggleOnline() {
    const msg = document.getElementById("statusMsg");
    msg.textContent = "";
    if (!online) {
      if (!navigator.geolocation) { msg.textContent = "Este navegador no soporta ubicación."; return; }
      setOnlineUI(true);
      startSendingLocation();
    } else {
      stopSendingLocation();
      try { await fetch(API + "/api/offline", { method: "POST", headers: { Authorization: "Bearer " + token } }); } catch (e) {}
      setOnlineUI(false);
    }
  }

  function startSendingLocation() {
    sendLocationOnce();
    watchTimer = setInterval(sendLocationOnce, 10000);
  }
  function stopSendingLocation() {
    if (watchTimer) clearInterval(watchTimer);
    watchTimer = null;
  }
  function sendLocationOnce() {
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          await fetch(API + "/api/location", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify({ lat: pos.coords.latitude, lng: pos.coords.longitude })
          });
        } catch (e) {
          document.getElementById("statusMsg").textContent = "No se pudo mandar la ubicación (revisá tu internet).";
        }
      },
      (err) => { document.getElementById("statusMsg").textContent = "Activá el permiso de ubicación para conectarte."; },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  // Si ya había sesión guardada, mostrar directo la pantalla de estado
  if (token && driver) { showStatusScreen(); }
</script>

</body>
</html>
